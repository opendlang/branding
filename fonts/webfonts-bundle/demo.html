<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="opendlang-fonts.css">
	<style>
		b {
			font-style: normal;
			font-weight: bold;
		}
		i {
			font-style: italic;
			font-weight: normal;
		}
		pre {
			color: #007;
		}
	</style>
</head>
<body>
	<h1>OpenD Web Font Demo</h1>
	<p>This is a paragraph.</p>
	<p>This is another paragraph with <i>italic</i> and <b>bold</b> text.</p>
	<p>The webfonts are loaded and automatically applied by embedding <code>opendlang-fonts.css</code>.</p>
	<p class="serif">The font of this text has serifs.</p>
	<pre>import std.stdio;
void main() {
	writeln("Look at this codeblock.");
}</pre>
</body>
</html>
